[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-voice-monitor"
version = "0.1.0"
description = "Monitor de Ubuntu que analiza el sistema con Gemini y reproduce el análisis por audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=5.9",
    # 3.x cambió httpx por httpx2; gemini.py usa httpx directamente
    "google-genai>=1.20,<3",
    "httpx>=0.27",
    "jinja2>=3.1",
    # Cliente D-Bus en Python puro para leer el estado de systemd
    "jeepney>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "pylint>=3.0",
    "mypy>=1.10",
    "types-psutil",
]
journald = [
    # Se compila contra libsystemd (apt install libsystemd-dev pkg-config)
    "systemd-python>=235",
]
piper = [
    "piper-tts>=1.2.0",
]
reports = [
    "weasyprint>=60.0",
]

[project.scripts]
narrator = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.storage" = ["*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
files = ["app", "tests", "scripts"]
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Bindings de Linux opcionales y sin anotaciones de tipos
module = ["dbus", "dbus.*", "systemd", "systemd.*", "jeepney", "jeepney.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
# Extras opcionales (piper, reports): pueden no estar instalados o no tener tipos
module = ["piper", "piper.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.10"
jobs = 0

[tool.pylint.format]
max-line-length = 90

[tool.pylint.typecheck]
# Pylint infers pydantic's Field(default_factory=...) attributes as FieldInfo,
# which raises false no-member errors.
ignored-classes = ["FieldInfo"]

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "import-error",
]
