[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-voice-monitor"
version = "0.1.0"
description = "Monitor de Ubuntu que analiza el sistema con Gemini y reproduce el análisis por audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "pylint>=3.0",
    "mypy>=1.10",
    "types-psutil",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
files = ["app", "tests", "scripts"]
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pylint.main]
py-version = "3.10"
jobs = 0

[tool.pylint.format]
max-line-length = 90

[tool.pylint.typecheck]
# Pylint infers pydantic's Field(default_factory=...) attributes as FieldInfo,
# which raises false no-member errors.
ignored-classes = ["FieldInfo"]

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
]
